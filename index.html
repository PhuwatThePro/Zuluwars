<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1879 Frontier Defense - Mountain Pass</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud-panel {
            background: rgba(20, 15, 10, 0.85);
            border: 2px solid #8b5a2b;
            color: #f0e6d2;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            pointer-events: auto;
        }

        #top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #hud-center {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(20, 15, 10, 0.85);
            border: 2px solid #d4af37;
            color: #f0e6d2;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            font-family: inherit;
        }
        .icon-btn:hover { background: #8b5a2b; }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #controls-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 8;
            pointer-events: none;
        }

        .touch-zone {
            position: absolute;
            pointer-events: auto;
        }

        #touch-look {
            top: 0;
            right: 0;
            width: 70%;
            height: 75%;
        }

        #joystick-bound {
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 60px;
            pointer-events: auto;
            position: absolute;
        }

        #joystick-thumb {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(139, 90, 43, 0.8);
            border: 2px solid #f0e6d2;
            border-radius: 25px;
        }

        #action-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }

        .btn {
            width: 75px;
            height: 75px;
            border-radius: 38px;
            background: linear-gradient(145deg, #8b5a2b, #4a2e11);
            border: 2px solid #d4af37;
            color: #f0e6d2;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            text-transform: uppercase;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.92);
            background: linear-gradient(145deg, #4a2e11, #8b5a2b);
        }

        #btn-switch {
            width: 55px;
            height: 55px;
            border-radius: 28px;
            align-self: flex-end;
            background: #2b4a8b;
        }

        #reload-bar-container {
            width: 150px;
            height: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #8b5a2b;
            margin-top: 5px;
            display: none;
        }
        #reload-bar {
            width: 0%;
            height: 100%;
            background: #d4af37;
        }

        #hit-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border: 3px solid #ff2222;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.08s ease-out;
            z-index: 6;
        }

        #wave-banner {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #d4af37;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-shadow: 3px 3px 6px #000;
        }
        #wave-banner h2 { font-size: 3.5rem; letter-spacing: 4px; }
        #wave-banner p { font-size: 1.2rem; color: #f0e6d2; margin-top: 5px; }

        #settings-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 25;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f0e6d2;
            pointer-events: auto;
        }
        .modal-box {
            background: #2a1f18;
            border: 3px solid #8b5a2b;
            padding: 25px 35px;
            border-radius: 8px;
            width: 340px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .modal-box h2 { color: #d4af37; margin-bottom: 20px; border-bottom: 1px solid #8b5a2b; padding-bottom: 10px; }
        .setting-row { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .toggle-group { display: flex; gap: 5px; }
        .toggle-btn {
            padding: 6px 12px;
            border: 1px solid #8b5a2b;
            background: #150f0b;
            color: #aaa;
            cursor: pointer;
            font-weight: bold;
        }
        .toggle-btn.active {
            background: #8b5a2b;
            color: #fff;
            border-color: #d4af37;
        }

        #game-over {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(50, 0, 0, 0.88);
            z-index: 20;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f0e6d2;
            pointer-events: auto;
        }
        #game-over h1 { font-size: 3rem; color: #ff3333; margin-bottom: 10px; text-shadow: 2px 2px #000; }
        #restart-btn, .close-btn {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1.1rem;
            background: #8b5a2b;
            color: #fff;
            border: 2px solid #d4af37;
            cursor: pointer;
            font-family: inherit;
        }
        
        .hint-text {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hit-indicator"></div>

    <div id="wave-banner">
        <h2 id="wave-title">WAVE 1</h2>
        <p id="wave-subtitle">DEFEND THE PASS</p>
    </div>

    <div id="ui-layer">
        <div id="top-hud">
            <div class="hud-panel">
                <div>SOLDIER HP: <span id="hp-val">100</span>%</div>
                <div>KILLS: <span id="score-val">0</span></div>
                <div style="color: #d4af37; margin-top: 4px;">WAVE: <span id="wave-val">1</span></div>
            </div>
            <div id="hud-center">
                <button class="icon-btn" onclick="toggleSettings()">⚙ SETTINGS</button>
            </div>
            <div class="hud-panel" style="text-align: right;">
                <div>WEAPON: <span id="weapon-val">MARTINI-HENRY</span></div>
                <div id="ammo-val">READY</div>
                <div id="reload-bar-container"><div id="reload-bar"></div></div>
                <div class="hint-text">[L-Click/Btn]: Fire | [Q/E]: Swap</div>
            </div>
        </div>
    </div>

    <div id="controls-layer">
        <div id="touch-look" class="touch-zone"></div>
        <div id="joystick-bound">
            <div id="joystick-thumb"></div>
        </div>
        <div id="action-buttons">
            <button id="btn-switch" class="btn">SWAP</button>
            <button id="btn-attack" class="btn">FIRE</button>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-box">
            <h2>SETTINGS</h2>
            <div class="setting-row">
                <span>CAMERA VIEW</span>
                <div class="toggle-group">
                    <button id="btn-cam-1p" class="toggle-btn active" onclick="setCameraMode('1P')">1st Person</button>
                    <button id="btn-cam-3p" class="toggle-btn" onclick="setCameraMode('3P')">3rd Person</button>
                </div>
            </div>
            <button class="close-btn" onclick="toggleSettings()">RESUME GAME</button>
        </div>
    </div>

    <div id="game-over">
        <h1>PASS OVERRUN</h1>
        <p>The Zulu warriors breached your perimeter.</p>
        <p>Waves Survived: <span id="final-wave">1</span> | Total Defeated: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">HOLD THE PASS AGAIN</button>
    </div>

    <script>
        const STATE = {
            hp: 100,
            score: 0,
            weapon: 'musket',
            reloading: false,
            lastAttackTime: 0,
            gameOver: false,
            wave: 1,
            zulusToSpawnInWave: 0,
            zulusRemainingInWave: 0,
            waveActive: false,
            cameraMode: '1P',
            settingsOpen: false
        };

        const CONFIG = {
            musketCooldown: 1800,
            swordCooldown: 800, // Doubled cooldown duration
            swordRange: 5.5,
            baseSpeed: 0.08,
            baseSpawnInterval: 2200,
            zuluDamage: 10,
            musketDamage: 2,
            swordDamage: 1
        };

        let currentWaveSpeed = CONFIG.baseSpeed;
        let currentSpawnInterval = CONFIG.baseSpawnInterval;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x95a5b5);
        scene.fog = new THREE.FogExp2(0x95a5b5, 0.010);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffeedd, 1.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff5ea, 1.1);
        sunLight.position.set(0, 60, -40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Valley Ground
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, 300),
            new THREE.MeshStandardMaterial({ color: 0x8a7343, roughness: 0.95 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Mountain Range & Colliders
        const mountainMat = new THREE.MeshStandardMaterial({ color: 0x3d3123, roughness: 0.9 });
        const mountainColliders = [];

        function buildMountains() {
            const mountainGroup = new THREE.Group();

            for (let i = -10; i <= 10; i++) {
                const h = 35 + Math.random() * 20;
                const r = 12 + Math.random() * 6;
                const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mountainMat);
                const px = i * 6;
                const pz = 18 + Math.random() * 6;
                m.position.set(px, h / 2, pz);
                mountainGroup.add(m);
                mountainColliders.push({ x: px, z: pz, radius: r * 0.75 });
            }

            for (let z = -55; z <= 20; z += 7) {
                const h = 30 + Math.random() * 15;
                const r = 10 + Math.random() * 5;
                const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), mountainMat);
                const px = -24 - Math.random() * 6;
                m.position.set(px, h / 2, z);
                mountainGroup.add(m);
                mountainColliders.push({ x: px, z: z, radius: r * 0.75 });
            }

            for (let z = -55; z <= 20; z += 7) {
                const h = 30 + Math.random() * 15;
                const r = 10 + Math.random() * 5;
                const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), mountainMat);
                const px = 24 + Math.random() * 6;
                m.position.set(px, h / 2, z);
                mountainGroup.add(m);
                mountainColliders.push({ x: px, z: z, radius: r * 0.75 });
            }

            for (let i = -8; i <= 8; i++) {
                const h = 35 + Math.random() * 20;
                const r = 12 + Math.random() * 6;
                const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mountainMat);
                const px = i * 7;
                const pz = -62 - Math.random() * 5;
                m.position.set(px, h / 2, pz);
                mountainGroup.add(m);
                mountainColliders.push({ x: px, z: pz, radius: r * 0.75 });
            }

            scene.add(mountainGroup);
        }
        buildMountains();

        function checkMountainCollision(pos) {
            if (pos.x < -21.5 || pos.x > 21.5 || pos.z > 13 || pos.z < -52) {
                return true;
            }
            for (let i = 0; i < mountainColliders.length; i++) {
                const c = mountainColliders[i];
                const dx = pos.x - c.x;
                const dz = pos.z - c.z;
                if (dx * dx + dz * dz < c.radius * c.radius) {
                    return true;
                }
            }
            return false;
        }

        // Mealbag Barricade
        const bagMat = new THREE.MeshStandardMaterial({ color: 0xb5a075, roughness: 0.9 });
        for (let i = -6; i <= 6; i++) {
            const angle = (i / 12) * Math.PI * 0.7;
            const bag = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 0.8), bagMat);
            bag.position.set(Math.sin(angle) * 7.5, 0.4, -Math.cos(angle) * 7.5);
            bag.rotation.y = angle;
            bag.castShadow = true;
            bag.receiveShadow = true;
            scene.add(bag);
        }

        // Environment Trees
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a2e11, roughness: 0.8 });
        const leafMat = new THREE.MeshStandardMaterial({ color: 0x475e2e, roughness: 0.9 });
        for (let i = 0; i < 24; i++) {
            const x = (Math.random() - 0.5) * 38;
            const z = -15 - Math.random() * 30;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3), woodMat);
            trunk.position.set(x, 1.5, z);
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.5, 6, 6), leafMat);
            leaves.position.set(x, 4, z);
            scene.add(trunk, leaves);
        }

        // Player Group Hierarchy
        const player = new THREE.Group();
        player.position.set(0, 0, 0);
        scene.add(player);

        // British Soldier Model
        const playerModel = new THREE.Group();
        const tunicMat = new THREE.MeshStandardMaterial({ color: 0xa81c1c, roughness: 0.7 }); 
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1c2738, roughness: 0.8 }); 
        const helmetMat = new THREE.MeshStandardMaterial({ color: 0xeee8dc, roughness: 0.5 }); 
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xd4a574, roughness: 0.8 });
        const beltMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.5 });
        const bootMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const ironMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.85, 0.35), tunicMat);
        torso.position.y = 0.95;
        torso.castShadow = true;
        playerModel.add(torso);

        const belt1 = new THREE.Mesh(new THREE.BoxGeometry(0.67, 0.08, 0.37), beltMat);
        belt1.position.y = 0.95;
        belt1.rotation.z = 0.45;
        const belt2 = new THREE.Mesh(new THREE.BoxGeometry(0.67, 0.08, 0.37), beltMat);
        belt2.position.y = 0.95;
        belt2.rotation.z = -0.45;
        playerModel.add(belt1, belt2);

        const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), skinMat);
        headMesh.position.y = 1.52;
        playerModel.add(headMesh);

        const helmetDome = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.25, 0.25, 12), helmetMat);
        helmetDome.position.y = 1.68;
        const helmetBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.04, 12), helmetMat);
        helmetBrim.position.y = 1.58;
        playerModel.add(helmetDome, helmetBrim);

        const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.75), pantsMat);
        leftLeg.position.set(-0.18, 0.4, 0);
        const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.75), pantsMat);
        rightLeg.position.set(0.18, 0.4, 0);
        playerModel.add(leftLeg, rightLeg);

        const leftBoot = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.25), bootMat);
        leftBoot.position.set(-0.18, 0.12, 0);
        const rightBoot = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.25), bootMat);
        rightBoot.position.set(0.18, 0.12, 0);
        playerModel.add(leftBoot, rightBoot);

        // Arms (Attached at Shoulder Level)
        const leftArmGroup = new THREE.Group();
        leftArmGroup.position.set(-0.38, 1.25, 0);
        const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.65), tunicMat);
        leftArm.position.y = -0.3;
        leftArmGroup.add(leftArm);
        playerModel.add(leftArmGroup);

        const rightArmGroup = new THREE.Group();
        rightArmGroup.position.set(0.38, 1.25, 0);
        const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.65), tunicMat);
        rightArm.position.y = -0.3;
        rightArmGroup.add(rightArm);
        playerModel.add(rightArmGroup);

        // Third Person Musket
        const tpMusket = new THREE.Group();
        const tpStock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.09, 1.1), woodMat);
        tpStock.position.set(0, 0, -0.3);
        const tpBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.3), ironMat);
        tpBarrel.rotation.x = Math.PI / 2;
        tpBarrel.position.set(0, 0.04, -0.6);
        const tpBayonet = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.45, 4), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9 }));
        tpBayonet.rotation.x = -Math.PI / 2;
        tpBayonet.position.set(0, 0.04, -1.45);
        tpMusket.add(tpStock, tpBarrel, tpBayonet);
        
        tpMusket.position.set(0, -0.55, 0);
        tpMusket.rotation.x = -Math.PI / 2;
        rightArmGroup.add(tpMusket);

        // Third Person Sword
        const tpSword = new THREE.Group();
        const tpBlade = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.85, 0.01), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95 }));
        tpBlade.position.set(0, 0.45, 0);
        const tpHilt = new THREE.Mesh(new THREE.SphereGeometry(0.07), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8 }));
        tpSword.add(tpBlade, tpHilt);
        tpSword.position.set(0, -0.55, 0);
        tpSword.rotation.x = -Math.PI / 2;
        tpSword.visible = false;
        rightArmGroup.add(tpSword);

        player.add(playerModel);
        playerModel.visible = false;

        const cameraNode = new THREE.Group();
        cameraNode.position.set(0, 1.6, 0);
        player.add(cameraNode);
        cameraNode.add(camera);

        // First Person Weapon Rig
        const weaponNode = new THREE.Group();
        weaponNode.position.set(0.35, -0.3, -0.5);
        cameraNode.add(weaponNode);

        const musketGroup = new THREE.Group();
        const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 1.2), woodMat);
        const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.4), ironMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.05, -0.3);
        const bayonet = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9 }));
        bayonet.rotation.x = -Math.PI / 2;
        bayonet.position.set(0, 0.05, -1.1);
        musketGroup.add(stock, barrel, bayonet);
        weaponNode.add(musketGroup);

        const swordGroup = new THREE.Group();
        const swordBlade = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.9, 0.01), new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95 }));
        swordBlade.position.set(0, 0.45, 0);
        const hilt = new THREE.Mesh(new THREE.SphereGeometry(0.08), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8 }));
        swordGroup.add(swordBlade, hilt);
        swordGroup.rotation.x = -Math.PI / 3;
        swordGroup.position.set(0, -0.1, -0.2);
        swordGroup.visible = false;
        weaponNode.add(swordGroup);

        // Updated left arm angles so it bends right across the body to grip the gun
        function updatePlayerPose() {
            if (STATE.weapon === 'musket') {
                rightArmGroup.rotation.set(1.2, -0.2, -0.1);
                leftArmGroup.rotation.set(1.25, -0.55, 0.35); // Reaches inward toward musket barrel
                tpMusket.visible = true;
                tpSword.visible = false;
            } else {
                rightArmGroup.rotation.set(0.9, 0.2, -0.2);
                leftArmGroup.rotation.set(0.2, 0.1, 0.1);
                tpMusket.visible = false;
                tpSword.visible = true;
            }
        }
        updatePlayerPose();

        // Smoke FX
        const smokeParticles = [];
        const smokeGeo = new THREE.SphereGeometry(0.25, 4, 4);
        const smokeMat = new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.7 });
        for (let i = 0; i < 15; i++) {
            const p = new THREE.Mesh(smokeGeo, smokeMat);
            p.visible = false;
            scene.add(p);
            smokeParticles.push({ mesh: p, life: 0, vx: 0, vy: 0, vz: 0 });
        }

        function triggerSmoke(pos, dir) {
            smokeParticles.forEach(p => {
                p.mesh.position.copy(pos);
                p.mesh.visible = true;
                p.mesh.scale.set(1, 1, 1);
                p.life = 1.0;
                p.vx = dir.x * 0.1 + (Math.random() - 0.5) * 0.05;
                p.vy = dir.y * 0.1 + Math.random() * 0.05;
                p.vz = dir.z * 0.1 + (Math.random() - 0.5) * 0.05;
            });
        }

        // Enemy System
        const zulus = [];

        function createZulu() {
            const group = new THREE.Group();

            const zuluSkinMat = new THREE.MeshStandardMaterial({ color: 0x6e3b23, roughness: 0.85 });
            const zuluShieldMat = new THREE.MeshStandardMaterial({ color: 0xd9c8a9, roughness: 0.7 });
            
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.35, 1.4), zuluSkinMat);
            body.position.y = 1.2;
            body.castShadow = true;
            group.add(body);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), zuluSkinMat);
            head.position.y = 2.1;
            head.castShadow = true;
            group.add(head);

            const shield = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.3, 0.05), zuluShieldMat);
            shield.position.set(-0.4, 1.2, 0.3);
            group.add(shield);

            const spearShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.2), woodMat);
            spearShaft.rotation.x = Math.PI / 2;
            spearShaft.position.set(0.4, 1.2, 0.4);
            group.add(spearShaft);

            const hitMesh = new THREE.Mesh(
                new THREE.SphereGeometry(1.2),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            hitMesh.position.y = 1.2;
            group.add(hitMesh);

            const spreadX = (Math.random() - 0.5) * 36;
            const spawnZ = -45 - Math.random() * 10;
            group.position.set(spreadX, 0, spawnZ);

            scene.add(group);
            zulus.push({
                group: group,
                hitTarget: hitMesh,
                animOffset: Math.random() * 10,
                hp: 2,
                skinMat: zuluSkinMat,
                shieldMat: zuluShieldMat
            });
        }

        function setCameraMode(mode) {
            STATE.cameraMode = mode;
            if (mode === '1P') {
                camera.position.set(0, 0, 0);
                playerModel.visible = false;
                weaponNode.visible = true;
                document.getElementById('btn-cam-1p').classList.add('active');
                document.getElementById('btn-cam-3p').classList.remove('active');
            } else {
                camera.position.set(0, 0.6, 3.5);
                playerModel.visible = true;
                weaponNode.visible = false;
                document.getElementById('btn-cam-3p').classList.add('active');
                document.getElementById('btn-cam-1p').classList.remove('active');
            }
        }

        function toggleSettings() {
            STATE.settingsOpen = !STATE.settingsOpen;
            document.getElementById('settings-modal').style.display = STATE.settingsOpen ? 'flex' : 'none';
        }

        function showWaveBanner(title, subtitle) {
            const banner = document.getElementById('wave-banner');
            document.getElementById('wave-title').innerText = title;
            document.getElementById('wave-subtitle').innerText = subtitle;
            banner.style.opacity = '1';
            setTimeout(() => { banner.style.opacity = '0'; }, 2500);
        }

        function startWave(waveNum) {
            STATE.wave = waveNum;
            STATE.zulusToSpawnInWave = 4 + waveNum * 4;
            STATE.zulusRemainingInWave = STATE.zulusToSpawnInWave;
            STATE.waveActive = false;

            currentWaveSpeed = CONFIG.baseSpeed + (waveNum - 1) * 0.01;
            currentSpawnInterval = Math.max(500, CONFIG.baseSpawnInterval - (waveNum - 1) * 200);

            document.getElementById('wave-val').innerText = STATE.wave;
            showWaveBanner(`WAVE ${waveNum}`, `ENEMIES APPROACHING: ${STATE.zulusToSpawnInWave}`);

            setTimeout(() => {
                STATE.waveActive = true;
                lastSpawn = performance.now();
            }, 3000);
        }

        let lastSpawn = 0;
        const input = { forward: 0, right: 0 };
        let yaw = 0, pitch = 0;

        function clampPitch() {
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        }

        function isMobile() {
            return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window);
        }

        container.addEventListener('click', (e) => {
            if (!isMobile() && !STATE.gameOver && !STATE.settingsOpen) {
                if (typeof container.requestPointerLock === 'function') {
                    try { container.requestPointerLock(); } catch (err) {}
                }
            }
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !STATE.gameOver && !STATE.settingsOpen) {
                if (e.target.closest('.btn') || e.target.closest('#restart-btn') || e.target.closest('.icon-btn') || e.target.closest('#settings-modal')) return;
                performAttack();
            }
        });

        let isMouseDown = false;
        let lastMouseX = 0, lastMouseY = 0;

        document.addEventListener('mousedown', (e) => {
            if (!isMobile() && !STATE.settingsOpen) {
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });
        document.addEventListener('mouseup', () => { isMouseDown = false; });

        document.addEventListener('mousemove', (e) => {
            if (STATE.settingsOpen) return;
            const hasPointerLock = document.pointerLockElement === container;
            if (hasPointerLock) {
                yaw -= e.movementX * 0.003;
                pitch -= e.movementY * 0.003;
                clampPitch();
            } else if (isMouseDown && !isMobile()) {
                yaw -= (e.clientX - lastMouseX) * 0.004;
                pitch -= (e.clientY - lastMouseY) * 0.004;
                clampPitch();
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyQ' || e.code === 'KeyE' || e.code === 'Digit1' || e.code === 'Digit2') {
                switchWeapon();
            }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        const touchLook = document.getElementById('touch-look');
        let touchLookId = null;
        let lastTouchX = 0, lastTouchY = 0;

        touchLook.addEventListener('touchstart', e => {
            for (let t of e.changedTouches) {
                if (touchLookId === null) {
                    touchLookId = t.identifier;
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        }, { passive: false });

        touchLook.addEventListener('touchmove', e => {
            for (let t of e.changedTouches) {
                if (t.identifier === touchLookId) {
                    yaw -= (t.clientX - lastTouchX) * 0.006;
                    pitch -= (t.clientY - lastTouchY) * 0.006;
                    clampPitch();
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                }
            }
        }, { passive: false });

        const resetTouchLook = e => {
            for (let t of e.changedTouches) { if (t.identifier === touchLookId) touchLookId = null; }
        };
        touchLook.addEventListener('touchend', resetTouchLook);
        touchLook.addEventListener('touchcancel', resetTouchLook);

        const joystickBound = document.getElementById('joystick-bound');
        const joystickThumb = document.getElementById('joystick-thumb');
        let joystickId = null;

        joystickBound.addEventListener('touchstart', e => {
            for (let t of e.changedTouches) {
                if (joystickId === null) {
                    joystickId = t.identifier;
                    updateJoystick(t);
                }
            }
        }, { passive: false });

        joystickBound.addEventListener('touchmove', e => {
            for (let t of e.changedTouches) {
                if (t.identifier === joystickId) updateJoystick(t);
            }
        }, { passive: false });

        const stopJoystick = e => {
            for (let t of e.changedTouches) {
                if (t.identifier === joystickId) {
                    joystickId = null;
                    joystickThumb.style.left = '35px';
                    joystickThumb.style.top = '35px';
                    input.forward = 0;
                    input.right = 0;
                }
            }
        };
        joystickBound.addEventListener('touchend', stopJoystick);
        joystickBound.addEventListener('touchcancel', stopJoystick);

        function updateJoystick(touch) {
            const rect = joystickBound.getBoundingClientRect();
            const x = touch.clientX - rect.left - 60;
            const y = touch.clientY - rect.top - 60;
            const dist = Math.min(Math.hypot(x, y), 40);
            const angle = Math.atan2(y, x);
            
            joystickThumb.style.left = `${35 + Math.cos(angle) * dist}px`;
            joystickThumb.style.top = `${35 + Math.sin(angle) * dist}px`;

            input.right = (Math.cos(angle) * dist) / 40;
            input.forward = -(Math.sin(angle) * dist) / 40;
        }

        document.getElementById('btn-attack').addEventListener('click', (e) => {
            e.stopPropagation();
            performAttack();
        });
        document.getElementById('btn-switch').addEventListener('click', (e) => {
            e.stopPropagation();
            switchWeapon();
        });

        function switchWeapon() {
            if (STATE.reloading || STATE.gameOver) return;
            if (STATE.weapon === 'musket') {
                STATE.weapon = 'sword';
                musketGroup.visible = false;
                swordGroup.visible = true;
                document.getElementById('btn-attack').innerText = "SLASH";
            } else {
                STATE.weapon = 'musket';
                musketGroup.visible = true;
                swordGroup.visible = false;
                document.getElementById('btn-attack').innerText = "FIRE";
            }
            updatePlayerPose();
            document.getElementById('weapon-val').innerText = STATE.weapon === 'musket' ? 'MARTINI-HENRY' : 'SWORD';
            updateAmmoUI();
        }

        const raycaster = new THREE.Raycaster();

        function showHitFeedback() {
            const ind = document.getElementById('hit-indicator');
            ind.style.opacity = '1';
            setTimeout(() => { ind.style.opacity = '0'; }, 90);
        }

        function damageZulu(index, damageAmount) {
            const z = zulus[index];
            z.hp -= damageAmount;
            showHitFeedback();

            z.skinMat.color.setHex(0xff3333);
            setTimeout(() => {
                if (z.skinMat) z.skinMat.color.setHex(0x6e3b23);
            }, 120);

            if (z.hp <= 0) {
                killZulu(index);
            }
        }

        function performAttack() {
            const now = performance.now();
            if (STATE.gameOver || STATE.settingsOpen) return;

            if (STATE.weapon === 'musket') {
                if (STATE.reloading) return;
                STATE.reloading = true;
                STATE.lastAttackTime = now;
                
                weaponNode.position.z += 0.25;
                weaponNode.rotation.x += 0.25;
                rightArmGroup.rotation.x += 0.2;

                const barrelWorldPos = new THREE.Vector3();
                barrel.getWorldPosition(barrelWorldPos);
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                triggerSmoke(barrelWorldPos, dir);

                const camWorldPos = new THREE.Vector3();
                camera.getWorldPosition(camWorldPos);
                raycaster.set(camWorldPos, dir);

                const targets = zulus.map(z => z.hitTarget);
                const hits = raycaster.intersectObjects(targets, false);

                if (hits.length > 0) {
                    const hitObject = hits[0].object;
                    const zIdx = zulus.findIndex(z => z.hitTarget === hitObject);
                    if (zIdx !== -1) {
                        damageZulu(zIdx, CONFIG.musketDamage);
                    }
                }

                document.getElementById('reload-bar-container').style.display = 'block';

            } else if (STATE.weapon === 'sword') {
                if (now - STATE.lastAttackTime < CONFIG.swordCooldown) return;
                STATE.lastAttackTime = now;

                swordGroup.rotation.z = -Math.PI / 1.5;
                rightArmGroup.rotation.set(1.4, -0.4, 0.4);
                
                const camWorldPos = new THREE.Vector3();
                camera.getWorldPosition(camWorldPos);
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);

                for (let i = zulus.length - 1; i >= 0; i--) {
                    const z = zulus[i];
                    const zPos = z.group.position.clone().add(new THREE.Vector3(0, 1.2, 0));
                    const dist = camWorldPos.distanceTo(zPos);
                    
                    if (dist < CONFIG.swordRange) {
                        const toZulu = zPos.sub(camWorldPos).normalize();
                        if (dir.dot(toZulu) > 0.15) {
                            damageZulu(i, CONFIG.swordDamage);
                            break;
                        }
                    }
                }
            }
        }

        function killZulu(index) {
            scene.remove(zulus[index].group);
            zulus.splice(index, 1);
            STATE.score++;
            STATE.zulusRemainingInWave--;
            document.getElementById('score-val').innerText = STATE.score;

            if (STATE.zulusRemainingInWave <= 0 && STATE.zulusToSpawnInWave <= 0) {
                STATE.waveActive = false;
                showWaveBanner(`WAVE ${STATE.wave} CLEARED!`, "REPOSITION AND REBOOT");
                setTimeout(() => {
                    startWave(STATE.wave + 1);
                }, 3500);
            }
        }

        function updateAmmoUI() {
            const ammoVal = document.getElementById('ammo-val');
            if (STATE.weapon === 'sword') {
                ammoVal.innerText = "READY";
                document.getElementById('reload-bar-container').style.display = 'none';
            } else {
                ammoVal.innerText = STATE.reloading ? "RELOADING..." : "READY";
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (!STATE.gameOver) {
                player.rotation.y = yaw;
                cameraNode.rotation.x = pitch;

                let moveZ = input.forward;
                let moveX = input.right;
                if (keys['KeyW']) moveZ = 1;
                if (keys['KeyS']) moveZ = -1;
                if (keys['KeyA']) moveX = -1;
                if (keys['KeyD']) moveX = 1;

                const moveDir = new THREE.Vector3(moveX, 0, -moveZ).normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                
                const nextPos = player.position.clone().addScaledVector(moveDir, 0.1);
                
                if (!checkMountainCollision(nextPos)) {
                    player.position.copy(nextPos);
                }

                if (STATE.reloading) {
                    const elapsed = performance.now() - STATE.lastAttackTime;
                    const progress = Math.min(elapsed / CONFIG.musketCooldown, 1.0);
                    document.getElementById('reload-bar').style.width = `${progress * 100}%`;
                    
                    if (progress >= 1.0) {
                        STATE.reloading = false;
                        document.getElementById('reload-bar-container').style.display = 'none';
                        updateAmmoUI();
                    }
                }

                weaponNode.position.z += (-0.5 - weaponNode.position.z) * 0.12;
                weaponNode.rotation.x += (0 - weaponNode.rotation.x) * 0.12;
                if (STATE.weapon === 'sword') {
                    swordGroup.rotation.z += (0 - swordGroup.rotation.z) * 0.15;
                }

                // Smooth arm rotations (left arm angled across chest to grip musket barrel)
                if (STATE.weapon === 'musket') {
                    rightArmGroup.rotation.x += (1.2 - rightArmGroup.rotation.x) * 0.1;
                    rightArmGroup.rotation.y += (-0.2 - rightArmGroup.rotation.y) * 0.1;
                    rightArmGroup.rotation.z += (-0.1 - rightArmGroup.rotation.z) * 0.1;
                    leftArmGroup.rotation.x += (1.25 - leftArmGroup.rotation.x) * 0.1;
                    leftArmGroup.rotation.y += (-0.55 - leftArmGroup.rotation.y) * 0.1;
                    leftArmGroup.rotation.z += (0.35 - leftArmGroup.rotation.z) * 0.1;
                } else {
                    rightArmGroup.rotation.x += (0.9 - rightArmGroup.rotation.x) * 0.1;
                    rightArmGroup.rotation.y += (0.2 - rightArmGroup.rotation.y) * 0.1;
                    rightArmGroup.rotation.z += (-0.2 - rightArmGroup.rotation.z) * 0.1;
                    leftArmGroup.rotation.x += (0.2 - leftArmGroup.rotation.x) * 0.1;
                    leftArmGroup.rotation.y += (0.1 - leftArmGroup.rotation.y) * 0.1;
                    leftArmGroup.rotation.z += (0.1 - leftArmGroup.rotation.z) * 0.1;
                }

                // Wave Spawning Loop
                if (STATE.waveActive && STATE.zulusToSpawnInWave > 0) {
                    if (performance.now() - lastSpawn > currentSpawnInterval) {
                        createZulu();
                        STATE.zulusToSpawnInWave--;
                        lastSpawn = performance.now();
                    }
                }

                zulus.forEach((z) => {
                    const zPos = z.group.position;
                    const dir = player.position.clone().sub(zPos);
                    dir.y = 0;
                    const dist = dir.length();
                    dir.normalize();

                    if (dist > 1.4) {
                        zPos.addScaledVector(dir, currentWaveSpeed);
                        z.group.lookAt(zPos.x + dir.x, zPos.y, zPos.z + dir.z);
                        z.group.rotation.z = Math.sin(time * 12 + z.animOffset) * 0.08;
                        zPos.y = Math.abs(Math.sin(time * 14 + z.animOffset)) * 0.2;
                    } else {
                        STATE.hp -= CONFIG.zuluDamage * delta;
                        document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(STATE.hp));
                        if (STATE.hp <= 0) triggerGameOver();
                    }
                });

                smokeParticles.forEach(p => {
                    if (p.mesh.visible) {
                        p.life -= delta * 1.5;
                        p.mesh.position.addScaledVector(new THREE.Vector3(p.vx, p.vy, p.vz), 1);
                        p.mesh.scale.addScalar(delta * 0.8);
                        if (p.life <= 0) p.mesh.visible = false;
                    }
                });
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            STATE.gameOver = true;
            document.getElementById('final-wave').innerText = STATE.wave;
            document.getElementById('final-score').innerText = STATE.score;
            document.getElementById('game-over').style.display = 'flex';
            if (document.pointerLockElement && typeof document.exitPointerLock === 'function') {
                document.exitPointerLock();
            }
        }

        function resetGame() {
            zulus.forEach(z => scene.remove(z.group));
            zulus.length = 0;

            STATE.hp = 100;
            STATE.score = 0;
            STATE.gameOver = false;
            STATE.reloading = false;

            player.position.set(0, 0, 0);
            yaw = 0;
            pitch = 0;
            document.getElementById('hp-val').innerText = 100;
            document.getElementById('score-val').innerText = 0;
            document.getElementById('game-over').style.display = 'none';
            updateAmmoUI();

            startWave(1);
        }

        function handleResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        window.addEventListener('resize', handleResize);
        new ResizeObserver(handleResize).observe(container);

        startWave(1);
        animate();
    </script>
</body>
</html>
