name: Fix weapons
on:
  push:
    paths:
      - '.github/workflows/fix-weapons.yml'
      - 'index.html'
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix weapon handling')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""        function switchWeapon() {
            if (STATE.reloading || STATE.isDead) return;
            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';
            
            // FP visual update
            musketGroup.visible = (STATE.weapon === 'musket');
            swordGroup.visible = (STATE.weapon === 'sword');

            document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';
        }"""
          new="""        function switchWeapon() {
            if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;

            // Switching weapons cancels the current musket reload completely.
            // Equipping the musket again starts a fresh reload cycle.
            STATE.reloading = false;
            STATE.lastAttackTime = 0;
            document.getElementById('reload-bar-container').style.display = 'none';
            document.getElementById('reload-bar').style.width = '0%';
            weaponNode.position.z = -0.5;
            weaponNode.rotation.x = 0;

            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';

            musketGroup.visible = (STATE.weapon === 'musket');
            swordGroup.visible = (STATE.weapon === 'sword');
            updateMusketCrosshair();
            document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';
        }"""
          if old not in s: raise SystemExit('switchWeapon block not found')
          s=s.replace(old,new,1)

          old="""            // Sword remains available for the existing weapon system.
            const tpSword = new THREE.Group();

            const tpBlade = new THREE.Mesh(
                new THREE.BoxGeometry(0.045, 0.88, 0.018),
                swordMat
            );
            tpBlade.position.y = 0.45;

            const tpHilt = new THREE.Mesh(
                new THREE.BoxGeometry(0.20, 0.045, 0.065),
                ironMat
            );
            tpHilt.position.y = 0.02;

            tpSword.add(tpBlade, tpHilt);
            tpSword.position.set(0.38, 0.74, -0.02);
            tpSword.rotation.z = 0.10;
            tpSword.visible = false;
            pModel.add(tpSword);"""
          new="""            // Proper third-person sword: tapered blade, guard, grip and pommel.
            const tpSword = new THREE.Group();
            const bladeShape = new THREE.Shape();
            bladeShape.moveTo(-0.055, 0);
            bladeShape.lineTo(0.055, 0);
            bladeShape.lineTo(0.045, 0.68);
            bladeShape.lineTo(0, 0.88);
            bladeShape.lineTo(-0.045, 0.68);
            bladeShape.closePath();
            const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, { depth: 0.025, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 1 });
            bladeGeo.center();
            const tpBlade = new THREE.Mesh(bladeGeo, swordMat);
            tpBlade.position.set(0, 0.47, 0);

            const tpGuard = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.30, 8), ironMat);
            tpGuard.rotation.z = Math.PI / 2;
            tpGuard.position.y = 0.025;
            const tpGrip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.25, 8), leatherMat);
            tpGrip.position.y = -0.12;
            const tpPommel = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), ironMat);
            tpPommel.position.y = -0.27;

            tpSword.add(tpBlade, tpGuard, tpGrip, tpPommel);
            tpSword.position.set(0.38, 0.78, -0.12);
            tpSword.rotation.z = 0.10;
            tpSword.visible = false;
            pModel.add(tpSword);"""
          if old not in s: raise SystemExit('third-person sword block not found')
          s=s.replace(old,new,1)

          old="""                data.musket.position.set(0.02, 0.92, -0.33);
                data.musket.rotation.set(0, 0, -0.43);"""
          new="""                // Keep the musket barrel pointing forward (-Z), toward the enemy.
                // The old model used a mostly vertical +Y barrel, making it look upward in 3P.
                data.musket.position.set(0.02, 1.02, -0.38);
                data.musket.rotation.set(-Math.PI / 2, 0, -0.10);"""
          if old not in s: raise SystemExit('musket pose block not found')
          s=s.replace(old,new,1)

          old="""                const rightHandTarget = new THREE.Vector3(
                    0.17, 0.88, -0.43
                );
                const leftHandTarget = new THREE.Vector3(
                    -0.04, 1.20, -0.45
                );"""
          new="""                const rightHandTarget = new THREE.Vector3(0.16, 1.05, -0.62);
                const leftHandTarget = new THREE.Vector3(-0.03, 1.30, -0.66);"""
          if old not in s: raise SystemExit('arm targets not found')
          s=s.replace(old,new,1)

          old="""                data.musket.position.set(0.02, 0.92, -0.33);"""
          # This earlier occurrence is handled above only once; avoid accidental changes.

          p.write_text(s,encoding='utf-8')

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix weapon handling and third-person models'
          git rm .github/workflows/fix-weapons.yml
          git commit -m 'Remove temporary weapon fixer'
          git push
