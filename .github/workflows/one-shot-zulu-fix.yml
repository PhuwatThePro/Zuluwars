name: One-shot Zulu fixes
on:
  push:
    paths:
      - '.github/workflows/one-shot-zulu-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standalone index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Preserve an unfinished musket reload across weapon switches.
          s = s.replace("            reloading: false,\n            lastAttackTime: 0,", "            reloading: false,\n            lastAttackTime: 0,\n            musketReloadUntil: 0,")

          s = s.replace("            zuluDamage: 36,\n            swordDamage: 1", "            zuluDamage: 36,\n            swordDamage: 1,\n            zuluStopDistance: 3.2,\n            zuluAttackRange: 3.8,\n            zuluAttackCooldown: 1.0")

          old = """        function switchWeapon() {\n            if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;\n\n            // Switching away from the musket instantly cancels and resets reload.\n            STATE.reloading = false;\n            STATE.lastAttackTime = 0;\n\n            const reloadContainer = document.getElementById('reload-bar-container');\n            const reloadBar = document.getElementById('reload-bar');\n            if (reloadContainer) reloadContainer.style.display = 'none';\n            if (reloadBar) reloadBar.style.width = '0%';\n\n            weaponNode.position.z = -0.5;\n            weaponNode.rotation.x = 0;\n\n            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';\n\n            musketGroup.visible = (STATE.weapon === 'musket');\n            swordGroup.visible = (STATE.weapon === 'sword');\n\n            document.getElementById('weapon-val').innerText =\n                (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n\n            if (STATE.weapon === 'musket') {\n                document.getElementById('ammo-val').innerText = 'READY';\n            }\n        }"""
          new = """        function switchWeapon() {\n            if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;\n\n            const now = performance.now();\n            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';\n\n            musketGroup.visible = (STATE.weapon === 'musket');\n            swordGroup.visible = (STATE.weapon === 'sword');\n            weaponNode.position.z = -0.5;\n            weaponNode.rotation.x = 0;\n\n            const reloadContainer = document.getElementById('reload-bar-container');\n            const reloadBar = document.getElementById('reload-bar');\n\n            if (STATE.weapon === 'sword') {\n                // Hide the UI while keeping the real reload deadline.\n                reloadContainer.style.display = 'none';\n                reloadBar.style.width = '0%';\n                STATE.reloading = STATE.musketReloadUntil > now;\n                document.getElementById('ammo-val').innerText = 'MELEE';\n            } else {\n                const remaining = Math.max(0, STATE.musketReloadUntil - now);\n                if (remaining > 0) {\n                    STATE.reloading = true;\n                    STATE.lastAttackTime = now - (CONFIG.musketCooldown - remaining);\n                    reloadContainer.style.display = 'block';\n                    document.getElementById('ammo-val').innerText = 'RELOADING';\n                } else {\n                    STATE.reloading = false;\n                    STATE.lastAttackTime = 0;\n                    reloadContainer.style.display = 'none';\n                    reloadBar.style.width = '0%';\n                    document.getElementById('ammo-val').innerText = 'READY';\n                }\n            }\n\n            document.getElementById('weapon-val').innerText =\n                (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n            updateMusketCrosshair();\n        }"""
          if old not in s:
              raise SystemExit('switchWeapon block not found')
          s = s.replace(old, new, 1)

          old = """                STATE.reloading = true;\n                STATE.lastAttackTime = now;\n                document.getElementById('reload-bar-container').style.display = 'block';"""
          new = """                STATE.reloading = true;\n                STATE.lastAttackTime = now;\n                STATE.musketReloadUntil = now + CONFIG.musketCooldown;\n                document.getElementById('reload-bar-container').style.display = 'block';\n                document.getElementById('ammo-val').innerText = 'RELOADING';"""
          if old not in s:
              raise SystemExit('musket reload start block not found')
          s = s.replace(old, new, 1)

          old = """                    const elapsed = performance.now() - STATE.lastAttackTime;\n                    const progress = Math.min(elapsed / CONFIG.musketCooldown, 1.0);"""
          new = """                    const nowReload = performance.now();\n                    const elapsed = nowReload - STATE.lastAttackTime;\n                    const progress = Math.min(elapsed / CONFIG.musketCooldown, 1.0);"""
          if old not in s:
              raise SystemExit('reload progress block not found')
          s = s.replace(old, new, 1)

          old = """                    if (progress >= 1.0) {\n                        STATE.reloading = false;\n                        document.getElementById('reload-bar-container').style.display = 'none';\n                        document.getElementById('reload-bar').style.width = '0%';\n                        weaponNode.position.z = -0.5;\n                        weaponNode.rotation.x = 0;\n                    }"""
          new = """                    if (progress >= 1.0) {\n                        STATE.reloading = false;\n                        STATE.musketReloadUntil = 0;\n                        document.getElementById('reload-bar-container').style.display = 'none';\n                        document.getElementById('reload-bar').style.width = '0%';\n                        document.getElementById('ammo-val').innerText = 'READY';\n                        weaponNode.position.z = -0.5;\n                        weaponNode.rotation.x = 0;\n                    }\n\n                    // When the sword is equipped, the reload timer still runs in the background.\n                    if (STATE.weapon === 'sword') {\n                        const left = Math.max(0, STATE.musketReloadUntil - nowReload);\n                        if (left <= 0) {\n                            STATE.reloading = false;\n                            STATE.musketReloadUntil = 0;\n                        }\n                    }"""
          if old not in s:
              raise SystemExit('reload progress completion block not found')
          s = s.replace(old, new, 1)

          old = """                    zulus.forEach(z => {\n                        const dx = player.position.x - z.group.position.x;\n                        const dz = player.position.z - z.group.position.z;\n                        if (dx * dx + dz * dz < 2.25) {\n                            STATE.hp -= CONFIG.zuluDamage * delta;\n                            document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(STATE.hp));\n                            if (STATE.hp <= 0) handlePlayerDeath();\n                        }\n                    });"""
          new = """                    zulus.forEach(z => {\n                        const dx = player.position.x - z.group.position.x;\n                        const dz = player.position.z - z.group.position.z;\n                        const dist = Math.sqrt(dx * dx + dz * dz);\n                        z.attackTimer = Math.max(0, (z.attackTimer || 0) - delta);\n\n                        if (dist < CONFIG.zuluStopDistance) {\n                            // Keep the enemy outside the player's body/camera space.\n                            const safeDist = CONFIG.zuluStopDistance;\n                            const inv = dist > 0.001 ? 1 / dist : 1;\n                            z.group.position.x = player.position.x - dx * inv * safeDist;\n                            z.group.position.z = player.position.z - dz * inv * safeDist;\n                        }\n\n                        if (dist <= CONFIG.zuluAttackRange && z.attackTimer <= 0) {\n                            STATE.hp -= CONFIG.zuluDamage;\n                            z.attackTimer = CONFIG.zuluAttackCooldown;\n                            document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(STATE.hp));\n                            if (STATE.hp <= 0) handlePlayerDeath();\n                        }\n                    });"""
          if old not in s:
              raise SystemExit('player damage block not found')
          s = s.replace(old, new, 1)

          s = s.replace("const zObj = { id: zId, group: group, headHitbox: headHitbox, bodyHitbox: bodyHitbox, hp: 2, animOffset: Math.random() * 10 };", "const zObj = { id: zId, group: group, headHitbox: headHitbox, bodyHitbox: bodyHitbox, hp: 2, animOffset: Math.random() * 10, attackTimer: 0 };", 1)

          s = s.replace("if (!blockedByBarricade && dir.length() > 1.2) {", "if (!blockedByBarricade && dir.length() > CONFIG.zuluStopDistance) {", 1)

          s = s.replace("STATE.hp = 100; STATE.score = 0; STATE.gameOver = false; STATE.isDead = false; STATE.reloading = false;", "STATE.hp = 100; STATE.score = 0; STATE.gameOver = false; STATE.isDead = false; STATE.reloading = false; STATE.musketReloadUntil = 0;", 1)

          p.write_text(s, encoding='utf-8')
          assert 'musketReloadUntil' in s
          assert 'zuluStopDistance' in s
          print('patched', len(s))
      - name: Commit patched index and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix musket reload persistence and Zulu close range'
          git rm .github/workflows/one-shot-zulu-fix.yml
          git commit -m 'Remove one-shot patch workflow'
          git push