name: Apply Zulu Wars gameplay fixes

on:
  push:
    paths:
      - '.github/workflows/zulu-wars-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Make Zulus face the player while advancing. Their visible
          # equipment is built on the model's +Z/front side, so the old
          # lookAt(+movement) made them appear to walk backwards.
          old = "z.group.lookAt(z.group.position.x + dir.x, z.group.position.y, z.group.position.z + dir.z);"
          new = "z.group.lookAt(z.group.position.x - dir.x, z.group.position.y, z.group.position.z - dir.z);"
          if old in s:
              s = s.replace(old, new, 1)

          # 2) Longer spear with a proper steel spearhead.
          old = """const spearShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 2.2), new THREE.MeshStandardMaterial({ color: 0x4a2e11 }));
            spearShaft.rotation.x = Math.PI / 2; spearShaft.position.set(0.4, 1.2, 0.4); group.add(spearShaft);"""
          new = """const spearShaft = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 3.0, 8), new THREE.MeshStandardMaterial({ color: 0x4a2e11, roughness: 0.9 }));
            spearShaft.rotation.x = Math.PI / 2; spearShaft.position.set(0.4, 1.2, 0.78); group.add(spearShaft);

            const spearHead = new THREE.Mesh(
                new THREE.ConeGeometry(0.075, 0.34, 6),
                new THREE.MeshStandardMaterial({ color: 0x9aa1a4, metalness: 0.9, roughness: 0.24 })
            );
            spearHead.rotation.x = Math.PI / 2;
            spearHead.position.set(0.4, 1.2, 2.36);
            group.add(spearHead);"""
          if old in s:
              s = s.replace(old, new, 1)

          # 3) Add a third-person musket aimer. When loaded, the musket tracks
          # the nearest living Zulu. During the local reload it returns to the
          # normal carry position instead of remaining pointed at the target.
          marker = """        const player = new THREE.Group();"""
          helper = r'''        function updateThirdPersonMusketAim(model, ownerRoot, weapon) {
            if (!model || !model.userData || !model.userData.musket) return;
            const musket = model.userData.musket;

            if (weapon !== 'musket') return;

            // Local player: during reload, keep the musket in its normal
            // carry/reload position. It cannot be instantly reset by swapping.
            if (ownerRoot === player && STATE.reloading) {
                musket.quaternion.set(0, 0, 0, 1);
                musket.rotation.set(0, 0, -0.43);
                musket.position.set(0.02, 0.92, -0.33);
                return;
            }

            let nearest = null;
            let nearestDistSq = Infinity;
            const ownerPos = ownerRoot.getWorldPosition(new THREE.Vector3());

            for (const z of zulus) {
                if (!z || !z.group) continue;
                const d2 = ownerPos.distanceToSquared(z.group.position);
                if (d2 < nearestDistSq) {
                    nearestDistSq = d2;
                    nearest = z;
                }
            }

            if (!nearest || nearestDistSq > 28 * 28) {
                musket.rotation.set(0, 0, -0.43);
                musket.position.set(0.02, 0.92, -0.33);
                return;
            }

            const targetWorld = nearest.group.position.clone();
            targetWorld.y += 1.35;
            const targetLocal = model.worldToLocal(targetWorld);
            const start = musket.position.clone();
            const aimDir = targetLocal.sub(start).normalize();

            if (aimDir.lengthSq() > 0.001) {
                musket.quaternion.setFromUnitVectors(
                    new THREE.Vector3(0, 1, 0),
                    aimDir
                );
            }
            musket.position.set(0.02, 0.92, -0.33);
        }

'''
          if marker in s and 'function updateThirdPersonMusketAim' not in s:
              s = s.replace(marker, helper + marker, 1)

          # 4) Call the aimer after normal pose animation for both local and
          # remote third-person models.
          old = """                    updateCharacterPose(playerModel, STATE.isMoving, STATE.weapon, time, delta);"""
          new = """                    updateCharacterPose(playerModel, STATE.isMoving, STATE.weapon, time, delta);
                    if (STATE.cameraMode === '3P') {
                        updateThirdPersonMusketAim(playerModel, player, STATE.weapon);
                    }"""
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          old = """                    updateCharacterPose(remotePlayerMesh, STATE.remoteIsMoving, STATE.remoteWeapon, time, delta);"""
          new = """                    updateCharacterPose(remotePlayerMesh, STATE.remoteIsMoving, STATE.remoteWeapon, time, delta);
                    updateThirdPersonMusketAim(remotePlayerMesh, remotePlayerMesh, STATE.remoteWeapon);"""
          if old in s and new not in s:
              s = s.replace(old, new, 1)

          # 5) Make sword attacks visibly slash even while the player is moving.
          # Use a short-lived swing timer rather than relying on a static pose.
          marker = """        function performAttack() {"""
          helper = r'''        let swordSwingUntil = 0;
        function updateSwordSwing(now) {
            if (!swordGroup) return;
            if (STATE.weapon !== 'sword') return;
            if (now < swordSwingUntil) {
                const progress = 1 - ((swordSwingUntil - now) / 260);
                const swing = Math.sin(progress * Math.PI);
                swordGroup.rotation.z = -1.05 + swing * 2.10;
                swordGroup.rotation.x = -Math.PI / 3 - swing * 0.30;
            }
        }

'''
          if marker in s and 'function updateSwordSwing' not in s:
              s = s.replace(marker, helper + marker, 1)

          old = """                swordGroup.rotation.z = -Math.PI / 1.5;"""
          new = """                swordSwingUntil = now + 260;
                swordGroup.rotation.z = -1.05;
                swordGroup.rotation.x = -Math.PI / 3;"""
          if old in s:
              s = s.replace(old, new, 1)

          old = """            if (!STATE.gameOver) {"""
          new = """            updateSwordSwing(performance.now());

            if (!STATE.gameOver) {"""
          if old in s and 'updateSwordSwing(performance.now());' not in s:
              s = s.replace(old, new, 1)

          # 6) Prevent a sword swing from being cancelled by the idle reset.
          old = """                if (STATE.weapon === 'sword') swordGroup.rotation.z += (0 - swordGroup.rotation.z) * 0.15;"""
          new = """                if (STATE.weapon === 'sword' && performance.now() >= swordSwingUntil) {
                    swordGroup.rotation.z += (0 - swordGroup.rotation.z) * 0.15;
                    swordGroup.rotation.x += (-Math.PI / 3 - swordGroup.rotation.x) * 0.15;
                }"""
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          # Verify all intended edits happened before committing.
          required = [
              "z.group.lookAt(z.group.position.x - dir.x",
              "const spearHead = new THREE.Mesh",
              "function updateThirdPersonMusketAim(model, ownerRoot, weapon)",
              "function updateSwordSwing(now)",
              "swordSwingUntil = now + 260"
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Patch verification failed: ' + ', '.join(missing))

      - name: Commit patched game and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/zulu-wars-fix.yml
          git commit -m "Fix Zulu facing, spear, musket aiming, and sword slash"
          git push
