name: Build standalone index
on:
  push:
    paths:
      - '.github/workflows/build-standalone.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone index.html
        shell: python
        run: |
          from pathlib import Path
          s=Path('old3index.html').read_text(encoding='utf-8')
          s=s.replace('#crosshair{position:absolute;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(238,232,216,.88);border-radius:2px}#crosshair:before{width:14px;height:2px;top:8px;left:2px}#crosshair:after{width:2px;height:14px;top:2px;left:8px}', '#crosshair{position:absolute;top:50%;left:50%;width:48px;height:48px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none;--gap:6px;transition:opacity .12s ease}.ch-line{position:absolute;display:block;background:rgba(238,232,216,.94);box-shadow:0 1px 3px rgba(0,0,0,.7);border-radius:1px}.ch-top,.ch-bottom{width:2px;height:10px;left:23px}.ch-left,.ch-right{width:10px;height:2px;top:23px}.ch-top{top:calc(0px - var(--gap))}.ch-bottom{bottom:calc(0px - var(--gap))}.ch-left{left:calc(0px - var(--gap))}.ch-right{right:calc(0px - var(--gap))}',1)
          s=s.replace('<div id="crosshair"></div>','<div id="crosshair"><span class="ch-line ch-top"></span><span class="ch-line ch-right"></span><span class="ch-line ch-bottom"></span><span class="ch-line ch-left"></span></div>',1)
          old="""        function switchWeapon() {\n            if (STATE.reloading || STATE.isDead) return;\n            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';\n            \n            // FP visual update\n            musketGroup.visible = (STATE.weapon === 'musket');\n            swordGroup.visible = (STATE.weapon === 'sword');\n\n            document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n        }"""
          new="""        function switchWeapon() {\n            if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;\n            STATE.reloading = false;\n            STATE.lastAttackTime = 0;\n            const reloadContainer = document.getElementById('reload-bar-container');\n            const reloadBar = document.getElementById('reload-bar');\n            if (reloadContainer) reloadContainer.style.display = 'none';\n            if (reloadBar) reloadBar.style.width = '0%';\n            weaponNode.position.z = -0.5;\n            weaponNode.rotation.x = 0;\n            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';\n            musketGroup.visible = (STATE.weapon === 'musket');\n            swordGroup.visible = (STATE.weapon === 'sword');\n            document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n            document.getElementById('ammo-val').innerText = STATE.weapon === 'musket' ? 'READY' : 'MELEE';\n            updateMusketCrosshair();\n        }"""
          if old not in s: raise SystemExit('switch block not found')
          s=s.replace(old,new,1)
          old="""        renderer.domElement.addEventListener('click', () => {\n            if (STATE.gameStarted && !STATE.settingsOpen && !STATE.gameOver && !STATE.isDead) {\n                renderer.domElement.requestPointerLock();\n            }\n        });"""
          new="""        renderer.domElement.addEventListener('click', () => {\n            if (STATE.gameStarted && !STATE.settingsOpen && !STATE.gameOver && !STATE.isDead && document.pointerLockElement !== renderer.domElement && renderer.domElement.requestPointerLock) {\n                renderer.domElement.requestPointerLock();\n            }\n        });"""
          if old not in s: raise SystemExit('click block not found')
          s=s.replace(old,new,1)
          old="""        window.addEventListener('mousedown', (e) => { \n            if (e.button === 0 && STATE.gameStarted && document.pointerLockElement === renderer.domElement) {\n                performAttack();\n            } \n        });"""
          new="""        window.addEventListener('mousedown', (e) => {\n            if (e.button !== 0) return;\n            if (!STATE.gameStarted || STATE.settingsOpen || STATE.gameOver || STATE.isDead) return;\n            if (document.pointerLockElement !== renderer.domElement && renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();\n            performAttack();\n        });"""
          if old not in s: raise SystemExit('mousedown block not found')
          s=s.replace(old,new,1)
          old="""                    if (progress >= 1.0) {\n                        STATE.reloading = false;\n                        document.getElementById('reload-bar-container').style.display = 'none';\n                    }"""
          new="""                    if (progress >= 1.0) {\n                        STATE.reloading = false;\n                        document.getElementById('reload-bar-container').style.display = 'none';\n                        document.getElementById('reload-bar').style.width = '0%';\n                        weaponNode.position.z = -0.5;\n                        weaponNode.rotation.x = 0;\n                    }"""
          if old not in s: raise SystemExit('reload block not found')
          s=s.replace(old,new,1)
          marker="        function showHitFeedback() {"
          helper="""        function updateMusketCrosshair() {\n            const ch = document.getElementById('crosshair');\n            if (!ch) return;\n            const gap = STATE.isMoving ? '13px' : '6px';\n            ch.style.setProperty('--gap', STATE.weapon === 'musket' ? gap : '3px');\n            ch.style.opacity = STATE.weapon === 'musket' ? '1' : '0.55';\n        }\n\n"""
          if marker not in s: raise SystemExit('crosshair marker not found')
          s=s.replace(marker,helper+marker,1)
          s=s.replace("document.getElementById('btn-switch').addEventListener('click', switchWeapon);","document.getElementById('btn-switch').addEventListener('click', switchWeapon);\n        updateMusketCrosshair();",1)
          s=s.replace("STATE.isMoving = (moveDir.lengthSq() > 0.01);","STATE.isMoving = (moveDir.lengthSq() > 0.01);\n                    updateMusketCrosshair();",1)
          old="""        function createRoom() {\n            playerName = document.getElementById('player-name').value || \"Host\";\n            const code = Math.floor(1000 + Math.random() * 9000);\n            isHost = true;\n            initPeer(`frontier-pass-${code}`);\n\n            document.getElementById('room-code-badge').style.display = 'block';\n            document.getElementById('room-code-val').innerText = code;\n            document.getElementById('network-status').innerText = \"HOSTING (WAITING)\";\n            startGame();\n        }"""
          new="""        function createRoom() {\n            playerName = document.getElementById('player-name').value || \"Host\";\n            const code = Math.floor(1000 + Math.random() * 9000);\n            isHost = true;\n            initPeer(`frontier-pass-${code}`);\n            document.getElementById('room-code-badge').style.display = 'block';\n            document.getElementById('room-code-val').innerText = code;\n            document.getElementById('network-status').innerText = \"HOSTING (WAITING)\";\n            startGame();\n            if (renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();\n        }"""
          if old not in s: raise SystemExit('createRoom block not found')
          s=s.replace(old,new,1)
          Path('index.html').write_text(s,encoding='utf-8')
          assert '<iframe' not in s
          assert 'requestPointerLock' in s
          assert 'updateMusketCrosshair' in s
          print('Standalone index ready',len(s))
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make index standalone with PC controls and weapon switching'
          git rm .github/workflows/build-standalone.yml
          git commit -m 'Remove temporary standalone build workflow'
          git push