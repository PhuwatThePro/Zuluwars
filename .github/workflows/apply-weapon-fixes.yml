name: Apply weapon fixes
on:
  push:
    paths:
      - '.github/workflows/apply-weapon-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply final weapon fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Weapon switching is always allowed when alive; switching cancels reload.
          pattern=r"function switchWeapon\(\)\s*\{.*?\n\s*\}\n\n\s*function updateMusketCrosshair"
          replacement=r'''function switchWeapon() {
              if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;

              // Switching weapons cancels the current reload completely.
              STATE.reloading = false;
              STATE.lastAttackTime = 0;

              const reloadContainer = document.getElementById('reload-bar-container');
              const reloadBar = document.getElementById('reload-bar');
              if (reloadContainer) reloadContainer.style.display = 'none';
              if (reloadBar) reloadBar.style.width = '0%';

              // Reset first-person weapon animation.
              if (typeof weaponNode !== 'undefined') {
                  weaponNode.position.z = -0.5;
                  weaponNode.rotation.x = 0;
              }

              STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';
              musketGroup.visible = (STATE.weapon === 'musket');
              swordGroup.visible = (STATE.weapon === 'sword');

              document.getElementById('weapon-val').innerText =
                  (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';

              if (typeof updateMusketCrosshair === 'function') updateMusketCrosshair();
          }


          function updateMusketCrosshair'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('switchWeapon pattern not found')
          s=s2

          # 2) Reset the weapon animation when reload completes.
          old="""if (progress >= 1.0) {
                        STATE.reloading = false;
                        document.getElementById('reload-bar-container').style.display = 'none';
                    }"""
          new="""if (progress >= 1.0) {
                        STATE.reloading = false;
                        document.getElementById('reload-bar-container').style.display = 'none';
                        document.getElementById('reload-bar').style.width = '0%';
                        weaponNode.position.z = -0.5;
                        weaponNode.rotation.x = 0;
                    }"""
          if old not in s: raise SystemExit('reload completion block not found')
          s=s.replace(old,new,1)

          # 3) Third-person musket pose: forward-facing barrel and hands aligned to it.
          old="""const rightHandTarget = new THREE.Vector3(
                    0.17, 0.88, -0.43
                );
                const leftHandTarget = new THREE.Vector3(
                    -0.04, 1.20, -0.45
                );"""
          new="""const rightHandTarget = new THREE.Vector3(
                    0.16, 1.04, -0.58
                );
                const leftHandTarget = new THREE.Vector3(
                    -0.02, 1.28, -0.64
                );"""
          if old not in s: raise SystemExit('hand targets not found')
          s=s.replace(old,new,1)

          old="""data.musket.position.set(0.02, 0.92, -0.33);
                data.musket.rotation.set(0, 0, -0.43);"""
          new="""data.musket.position.set(0.02, 1.02, -0.38);
                // Weapon geometry is built vertically, so rotate it to aim along character forward (-Z).
                data.musket.rotation.set(-Math.PI / 2, 0, -0.10);"""
          if old not in s: raise SystemExit('musket pose not found')
          s=s.replace(old,new,1)

          # Keep marching bob centered on the new weapon height.
          s=s.replace("data.musket.position.y = 0.92 + bob;","data.musket.position.y = 1.02 + bob;",1)

          # 4) Replace stick sword with a tapered blade, guard, grip and pommel.
          old="""const tpSword = new THREE.Group();

            const tpBlade = new THREE.Mesh(
                new THREE.BoxGeometry(0.045, 0.88, 0.018),
                swordMat
            );
            tpBlade.position.y = 0.45;

            const tpHilt = new THREE.Mesh(
                new THREE.BoxGeometry(0.20, 0.045, 0.065),
                ironMat
            );
            tpHilt.position.y = 0.02;

            tpSword.add(tpBlade, tpHilt);
            tpSword.position.set(0.38, 0.74, -0.02);
            tpSword.rotation.z = 0.10;
            tpSword.visible = false;
            pModel.add(tpSword);"""
          new="""const tpSword = new THREE.Group();

            // Tapered third-person blade.
            const bladeShape = new THREE.Shape();
            bladeShape.moveTo(-0.055, 0);
            bladeShape.lineTo(0.055, 0);
            bladeShape.lineTo(0.045, 0.68);
            bladeShape.lineTo(0.0, 0.90);
            bladeShape.lineTo(-0.045, 0.68);
            bladeShape.closePath();

            const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape, {
                depth: 0.025,
                bevelEnabled: true,
                bevelThickness: 0.006,
                bevelSize: 0.006,
                bevelSegments: 1
            });
            bladeGeometry.center();

            const tpBlade = new THREE.Mesh(bladeGeometry, swordMat);
            tpBlade.position.set(0, 0.48, 0);

            // Crossguard.
            const tpGuard = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 0.30, 8),
                ironMat
            );
            tpGuard.rotation.z = Math.PI / 2;
            tpGuard.position.y = 0.025;

            // Grip.
            const tpGrip = new THREE.Mesh(
                new THREE.CylinderGeometry(0.035, 0.035, 0.25, 8),
                leatherMat
            );
            tpGrip.position.y = -0.12;

            // Pommel.
            const tpPommel = new THREE.Mesh(
                new THREE.SphereGeometry(0.055, 8, 6),
                ironMat
            );
            tpPommel.position.y = -0.27;

            tpSword.add(tpBlade, tpGuard, tpGrip, tpPommel);
            tpSword.position.set(0.38, 0.78, -0.12);
            tpSword.rotation.z = 0.10;
            tpSword.visible = false;
            pModel.add(tpSword);"""
          if old not in s: raise SystemExit('sword block not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('Weapon fixes applied successfully.')

      - name: Validate
        run: |
          test -s index.html
          grep -q "Switching weapons cancels the current reload" index.html
          grep -q "bladeShape" index.html
          grep -q "Math.PI / 2" index.html
          echo "Validation passed."

      - name: Commit patched index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply final weapon fixes'
          git push
