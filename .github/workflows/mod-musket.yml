name: Build modded index
on:
  push:
    paths:
      - '.github/workflows/mod-musket.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one-file index
        shell: python
        run: |
          from pathlib import Path
          import urllib.request
          raw='https://raw.githubusercontent.com/PhuwatThePro/Zuluwars/main/old3index.html'
          s=urllib.request.urlopen(raw).read().decode('utf-8')
          old='''#crosshair{position:absolute;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(238,232,216,.88);border-radius:2px}#crosshair:before{width:14px;height:2px;top:8px;left:2px}#crosshair:after{width:2px;height:14px;top:2px;left:8px}'''
          new='''#crosshair{position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none;--spread:0px}#crosshair .ch{position:absolute;display:block;background:rgba(238,232,216,.92);box-shadow:0 1px 3px rgba(0,0,0,.65);border-radius:1px}#crosshair .top,#crosshair .bottom{width:2px;height:9px;left:21px}#crosshair .left,#crosshair .right{width:9px;height:2px;top:21px}#crosshair .top{top:calc(2px - var(--spread))}#crosshair .bottom{bottom:calc(2px - var(--spread))}#crosshair .left{left:calc(2px - var(--spread))}#crosshair .right{right:calc(2px - var(--spread))}#crosshair .center{width:3px;height:3px;left:20px;top:20px;border-radius:50%;opacity:.65}'''
          if old not in s: raise SystemExit('crosshair CSS not found')
          s=s.replace(old,new,1)
          s=s.replace('<div id="crosshair"></div>','<div id="crosshair"><i class="ch top"></i><i class="ch right"></i><i class="ch bottom"></i><i class="ch left"></i><i class="ch center"></i></div>',1)
          oldaim='''const dir = camera.getWorldDirection(new THREE.Vector3());'''
          newaim='''const dir = camera.getWorldDirection(new THREE.Vector3());

            // Musket accuracy: intentionally imperfect, with extra spread while moving.
            if (STATE.weapon === 'musket') {
                const spread = STATE.isMoving ? 0.075 : 0.032;
                const yawSpread = (Math.random() - 0.5) * spread;
                const pitchSpread = (Math.random() - 0.5) * spread;
                const right = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
                const up = new THREE.Vector3().crossVectors(right, dir).normalize();
                dir.addScaledVector(right, yawSpread).addScaledVector(up, pitchSpread).normalize();
            }'''
          if oldaim not in s: raise SystemExit('aim line not found')
          s=s.replace(oldaim,newaim,1)
          hook='''\n        function updateMusketCrosshair() {\n            const ch = document.getElementById('crosshair');\n            if (!ch) return;\n            if (STATE.weapon === 'musket') {\n                ch.style.setProperty('--spread', STATE.isMoving ? '12px' : '5px');\n                ch.style.opacity = '1';\n            } else {\n                ch.style.setProperty('--spread', '0px');\n                ch.style.opacity = '0.65';\n            }\n        }\n'''
          anchor='''        function showHitFeedback() {'''
          if anchor not in s: raise SystemExit('hook anchor not found')
          s=s.replace(anchor,hook+'\n'+anchor,1)
          state_line='''                    STATE.isMoving = (moveDir.lengthSq() > 0.01);'''
          if state_line not in s: raise SystemExit('movement line not found')
          s=s.replace(state_line,state_line+'\n                    updateMusketCrosshair();',1)
          Path('index.html').write_text(s,encoding='utf-8')
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Create full one-file modded Zulu Wars index' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/mod-musket.yml
          git commit -m 'Remove temporary build workflow'
          git push
