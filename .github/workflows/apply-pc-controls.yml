name: Apply PC controls
on:
  push:
    paths:
      - '.github/workflows/apply-pc-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html from original source
        shell: python
        run: |
          from pathlib import Path
          import urllib.request
          raw='https://raw.githubusercontent.com/PhuwatThePro/Zuluwars/main/old3index.html'
          s=urllib.request.urlopen(raw).read().decode('utf-8')

          old_css='''#crosshair{position:absolute;top:50%;left:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none}#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(238,232,216,.88);border-radius:2px}#crosshair:before{width:14px;height:2px;top:8px;left:2px}#crosshair:after{width:2px;height:14px;top:2px;left:8px}'''
          new_css='''#crosshair{position:absolute;top:50%;left:50%;width:46px;height:46px;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none;--gap:7px}.ch-line{position:absolute;display:block;background:rgba(238,232,216,.92);box-shadow:0 1px 3px rgba(0,0,0,.65);border-radius:1px}.ch-top,.ch-bottom{width:2px;height:9px;left:22px}.ch-left,.ch-right{width:9px;height:2px;top:22px}.ch-top{top:calc(0px - var(--gap))}.ch-bottom{bottom:calc(0px - var(--gap))}.ch-left{left:calc(0px - var(--gap))}.ch-right{right:calc(0px - var(--gap))}'''
          if old_css not in s: raise SystemExit('crosshair CSS not found')
          s=s.replace(old_css,new_css,1)
          s=s.replace('<div id="crosshair"></div>','<div id="crosshair"><span class="ch-line ch-top"></span><span class="ch-line ch-right"></span><span class="ch-line ch-bottom"></span><span class="ch-line ch-left"></span></div>',1)

          old_switch='''        function switchWeapon() {\n            if (STATE.reloading || STATE.isDead) return;\n            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';\n            \n            // FP visual update\n            musketGroup.visible = (STATE.weapon === 'musket');\n            swordGroup.visible = (STATE.weapon === 'sword');\n\n            document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n        }'''
          new_switch='''        function switchWeapon() {\n            if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;\n\n            // Switching away from the musket instantly cancels and resets reload.\n            STATE.reloading = false;\n            STATE.lastAttackTime = 0;\n\n            const reloadContainer = document.getElementById('reload-bar-container');\n            const reloadBar = document.getElementById('reload-bar');\n            if (reloadContainer) reloadContainer.style.display = 'none';\n            if (reloadBar) reloadBar.style.width = '0%';\n\n            weaponNode.position.z = -0.5;\n            weaponNode.rotation.x = 0;\n\n            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';\n\n            musketGroup.visible = (STATE.weapon === 'musket');\n            swordGroup.visible = (STATE.weapon === 'sword');\n\n            document.getElementById('weapon-val').innerText =\n                (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n\n            if (STATE.weapon === 'musket') {\n                document.getElementById('ammo-val').innerText = 'READY';\n            }\n        }'''
          if old_switch not in s: raise SystemExit('switchWeapon block not found')
          s=s.replace(old_switch,new_switch,1)

          old_mouse='''        renderer.domElement.addEventListener('click', () => {\n            if (STATE.gameStarted && !STATE.settingsOpen && !STATE.gameOver && !STATE.isDead) {\n                renderer.domElement.requestPointerLock();\n            }\n        });'''
          new_mouse='''        renderer.domElement.addEventListener('click', () => {\n            if (STATE.gameStarted && !STATE.settingsOpen && !STATE.gameOver && !STATE.isDead) {\n                if (document.pointerLockElement !== renderer.domElement) {\n                    renderer.domElement.requestPointerLock();\n                }\n            }\n        });'''
          if old_mouse not in s: raise SystemExit('click handler not found')
          s=s.replace(old_mouse,new_mouse,1)

          old_down='''        window.addEventListener('mousedown', (e) => { \n            if (e.button === 0 && STATE.gameStarted && document.pointerLockElement === renderer.domElement) {\n                performAttack();\n            } \n        });'''
          new_down='''        window.addEventListener('mousedown', (e) => {\n            if (e.button !== 0) return;\n            if (!STATE.gameStarted || STATE.settingsOpen || STATE.gameOver || STATE.isDead) return;\n\n            // PC: left click always fires. If the mouse is not locked yet, lock it first.\n            if (document.pointerLockElement !== renderer.domElement) {\n                renderer.domElement.requestPointerLock();\n            }\n\n            performAttack();\n        });'''
          if old_down not in s: raise SystemExit('mousedown handler not found')
          s=s.replace(old_down,new_down,1)

          # Correct the reload completion so the weapon is definitely reset.
          old_reload='''                    if (progress >= 1.0) {\n                        STATE.reloading = false;\n                        document.getElementById('reload-bar-container').style.display = 'none';\n                    }'''
          new_reload='''                    if (progress >= 1.0) {\n                        STATE.reloading = false;\n                        document.getElementById('reload-bar-container').style.display = 'none';\n                        document.getElementById('reload-bar').style.width = '0%';\n                        weaponNode.position.z = -0.5;\n                        weaponNode.rotation.x = 0;\n                    }'''
          if old_reload not in s: raise SystemExit('reload completion block not found')
          s=s.replace(old_reload,new_reload,1)

          # Make the spread crosshair widen while moving and tighten while stationary.
          marker='''        function showHitFeedback() {'''
          helper='''        function updateMusketCrosshair() {\n            const ch = document.getElementById('crosshair');\n            if (!ch) return;\n            if (STATE.weapon === 'musket') {\n                ch.style.display = 'block';\n                ch.style.setProperty('--gap', STATE.isMoving ? '12px' : '6px');\n            } else {\n                ch.style.display = 'block';\n                ch.style.setProperty('--gap', '3px');\n            }\n        }\n\n'''
          if marker not in s: raise SystemExit('crosshair marker not found')
          s=s.replace(marker,helper+marker,1)
          s=s.replace("document.getElementById('btn-switch').addEventListener('click', switchWeapon);","document.getElementById('btn-switch').addEventListener('click', switchWeapon);\n        updateMusketCrosshair();",1)
          s=s.replace("STATE.isMoving = (moveDir.lengthSq() > 0.01);","STATE.isMoving = (moveDir.lengthSq() > 0.01);\n                    updateMusketCrosshair();",1)
          s=s.replace("document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';","document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';\n            updateMusketCrosshair();",1)

          Path('index.html').write_text(s,encoding='utf-8')
      - name: Validate source
        shell: bash
        run: |
          test -s index.html
          grep -q "requestPointerLock" index.html
          grep -q "Switching away from the musket instantly cancels and resets reload" index.html
          grep -q "updateMusketCrosshair" index.html
          echo 'Validation passed.'
      - name: Commit result and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix PC mouse controls and instant weapon switching'
          git rm .github/workflows/apply-pc-controls.yml
          git commit -m 'Remove temporary PC control workflow'
          git push
