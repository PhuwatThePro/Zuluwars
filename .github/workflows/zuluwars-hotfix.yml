name: Zulu Wars hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply gameplay fixes directly to the one-file game
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          def R(a,b):
              global s
              if a not in s: raise SystemExit('anchor missing: '+a[:60])
              s=s.replace(a,b,1)
          R('#hit-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border:2px solid #c75b55;border-radius:50%;pointer-events:none;opacity:0;z-index:6}', '#hit-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border:2px solid #c75b55;border-radius:50%;pointer-events:none;opacity:0;z-index:6}#damage-flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background:rgba(205,24,24,.34);box-shadow:inset 0 0 120px rgba(255,38,38,.85);transition:opacity .06s ease}')
          R('<div id="hit-indicator"></div>', '<div id="hit-indicator"></div>\n    <div id="damage-flash"></div>')
          R('''                        if (dist < CONFIG.zuluStopDistance) {
                            // Keep the enemy outside the player's body/camera space.
                            const safeDist = CONFIG.zuluStopDistance;
                            const inv = dist > 0.001 ? 1 / dist : 1;
                            z.group.position.x = player.position.x - dx * inv * safeDist;
                            z.group.position.z = player.position.z - dz * inv * safeDist;
                        }

''','')
          R('''                            STATE.hp -= CONFIG.zuluDamage;
                            z.attackTimer = CONFIG.zuluAttackCooldown;
                            document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(STATE.hp));''','''                            STATE.hp -= CONFIG.zuluDamage;
                            z.attackTimer = CONFIG.zuluAttackCooldown;
                            showDamageFlash();
                            document.getElementById('hp-val').innerText = Math.max(0, Math.ceil(STATE.hp));''')
          R('''                    // Loaded/ready: keep the musket forward in the soldier's
                    // facing direction, with both hands seated on the stock.
                    data.musket.position.set(0.04, 0.96, -0.28);
                    data.musket.rotation.set(0, 0, -0.43);''','''                    // Loaded/ready: point the musket directly along the soldier's -Z facing axis.
                    data.musket.position.set(0.04, 0.98, -0.22);
                    data.musket.rotation.set(-Math.PI / 2, 0, 0);''')
          R('''            pModel.userData = {
                musket: tpMusket,
                sword: tpSword,''','''            pModel.userData = {
                musket: tpMusket,
                sword: tpSword,
                slashTime: 0,''')
          R('''                // Right hand forward with the sword, left arm relaxed.
                const swordHandTarget = new THREE.Vector3(
                    0.42, 1.00, -0.35
                );

                pointArmAt(rArm, swordHandTarget);

                lArm.rotation.set(0, 0, 0.12);''','''                // Third-person sword attack pose.
                const slashAge = performance.now() - (data.slashTime || 0);
                const slashing = slashAge >= 0 && slashAge < 360;
                const slashT = slashing ? slashAge / 360 : 1;
                const slashCurve = slashing ? Math.sin(slashT * Math.PI) : 0;
                const swordHandTarget = new THREE.Vector3(slashing ? 0.62 : 0.42, slashing ? 1.18 : 1.00, slashing ? -0.48 : -0.35);
                pointArmAt(rArm, swordHandTarget);
                lArm.rotation.set(0, 0, 0.12);
                data.sword.position.set(0.38, 0.74, -0.02);
                data.sword.rotation.set(0.12 + slashCurve * 0.35, -0.18 + slashCurve * 0.22, slashing ? 1.05 - slashCurve * 2.35 : 0.10);''')
          R('''                // Visible slash; movement is not blocked while attacking.
                swordGroup.userData.slashTime = now;
                swordGroup.rotation.z = -Math.PI / 1.5;''','''                // Visible first-person slash plus third-person slash.
                swordGroup.userData.slashTime = now;
                playerModel.userData.slashTime = now;
                swordGroup.rotation.z = -Math.PI / 1.5;''')
          R('        function handlePlayerDeath() {','''        function showDamageFlash() {
            const flash = document.getElementById('damage-flash');
            if (!flash) return;
            flash.style.opacity = '1';
            clearTimeout(showDamageFlash._timer);
            showDamageFlash._timer = setTimeout(() => flash.style.opacity = '0', 180);
        }

        function handlePlayerDeath() {''')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit gameplay changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/zuluwars-hotfix.yml
          git commit -m 'Fix Zulu movement, musket aim, 3P sword slash and damage flash'
          git push origin HEAD:main
