name: Apply final weapon fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply final weapon fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1. Allow weapon switching during reload and fully cancel/reset reload.
          old = """        function switchWeapon() {
            if (STATE.reloading || STATE.isDead) return;
            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';
            
            // FP visual update
            musketGroup.visible = (STATE.weapon === 'musket');
            swordGroup.visible = (STATE.weapon === 'sword');

            document.getElementById('weapon-val').innerText = (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';
        }"""
          new = """        function switchWeapon() {
            if (STATE.isDead || STATE.gameOver || !STATE.gameStarted) return;

            // Switching weapons cancels the current musket reload completely.
            STATE.reloading = false;
            STATE.lastAttackTime = 0;

            const reloadContainer = document.getElementById('reload-bar-container');
            const reloadBar = document.getElementById('reload-bar');
            if (reloadContainer) reloadContainer.style.display = 'none';
            if (reloadBar) reloadBar.style.width = '0%';

            weaponNode.position.z = -0.5;
            weaponNode.rotation.x = 0;

            STATE.weapon = STATE.weapon === 'musket' ? 'sword' : 'musket';
            musketGroup.visible = (STATE.weapon === 'musket');
            swordGroup.visible = (STATE.weapon === 'sword');

            document.getElementById('weapon-val').innerText =
                (STATE.weapon === 'musket') ? 'MUSKET' : 'SWORD';

            updateMusketCrosshair();
        }"""
          if old not in s:
              raise SystemExit('ERROR: switchWeapon block not found')
          s = s.replace(old, new, 1)

          # 2. Reset the reload animation/bar when a reload finishes.
          old = """                    if (progress >= 1.0) {
                        STATE.reloading = false;
                        document.getElementById('reload-bar-container').style.display = 'none';
                    }"""
          new = """                    if (progress >= 1.0) {
                        STATE.reloading = false;
                        document.getElementById('reload-bar-container').style.display = 'none';
                        document.getElementById('reload-bar').style.width = '0%';
                        weaponNode.position.z = -0.5;
                        weaponNode.rotation.x = 0;
                    }"""
          if old not in s:
              raise SystemExit('ERROR: reload completion block not found')
          s = s.replace(old, new, 1)

          # 3. Correct third-person musket direction and two-handed pose.
          old = """                const rightHandTarget = new THREE.Vector3(
                    0.17, 0.88, -0.43
                );
                const leftHandTarget = new THREE.Vector3(
                    -0.04, 1.20, -0.45
                );"""
          new = """                const rightHandTarget = new THREE.Vector3(
                    0.16, 1.04, -0.58
                );
                const leftHandTarget = new THREE.Vector3(
                    -0.02, 1.28, -0.64
                );"""
          if old not in s:
              raise SystemExit('ERROR: arm target block not found')
          s = s.replace(old, new, 1)

          old = """                data.musket.position.set(0.02, 0.92, -0.33);
                data.musket.rotation.set(0, 0, -0.43);"""
          new = """                // Keep the third-person musket aimed forward toward the enemy.
                // The musket model is built along local +Y, so rotate it onto -Z.
                data.musket.position.set(0.02, 1.02, -0.38);
                data.musket.rotation.set(-Math.PI / 2, 0, -0.10);"""
          if old not in s:
              raise SystemExit('ERROR: third-person musket block not found')
          s = s.replace(old, new, 1)

          old = """                    data.musket.position.y = 0.92 + bob;"""
          new = """                    data.musket.position.y = 1.02 + bob;"""
          if old not in s:
              raise SystemExit('ERROR: musket bob block not found')
          s = s.replace(old, new, 1)

          # 4. Replace the stick-like third-person sword with a tapered blade,
          #    crossguard, grip and pommel.
          old = """            const tpSword = new THREE.Group();

            const tpBlade = new THREE.Mesh(
                new THREE.BoxGeometry(0.045, 0.88, 0.018),
                swordMat
            );
            tpBlade.position.y = 0.45;

            const tpHilt = new THREE.Mesh(
                new THREE.BoxGeometry(0.20, 0.045, 0.065),
                ironMat
            );
            tpHilt.position.y = 0.02;

            tpSword.add(tpBlade, tpHilt);
            tpSword.position.set(0.38, 0.74, -0.02);
            tpSword.rotation.z = 0.10;
            tpSword.visible = false;
            pModel.add(tpSword);"""
          new = """            const tpSword = new THREE.Group();

            // Tapered sword blade.
            const bladeShape = new THREE.Shape();
            bladeShape.moveTo(-0.055, 0);
            bladeShape.lineTo(0.055, 0);
            bladeShape.lineTo(0.045, 0.68);
            bladeShape.lineTo(0.0, 0.90);
            bladeShape.lineTo(-0.045, 0.68);
            bladeShape.closePath();

            const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape, {
                depth: 0.025,
                bevelEnabled: true,
                bevelThickness: 0.006,
                bevelSize: 0.006,
                bevelSegments: 1
            });
            bladeGeometry.center();

            const tpBlade = new THREE.Mesh(bladeGeometry, swordMat);
            tpBlade.position.set(0, 0.48, 0);

            // Crossguard.
            const tpGuard = new THREE.Mesh(
                new THREE.CylinderGeometry(0.025, 0.025, 0.30, 8),
                ironMat
            );
            tpGuard.rotation.z = Math.PI / 2;
            tpGuard.position.y = 0.025;

            // Grip.
            const tpGrip = new THREE.Mesh(
                new THREE.CylinderGeometry(0.035, 0.035, 0.25, 8),
                leatherMat
            );
            tpGrip.position.y = -0.12;

            // Pommel.
            const tpPommel = new THREE.Mesh(
                new THREE.SphereGeometry(0.055, 8, 6),
                ironMat
            );
            tpPommel.position.y = -0.27;

            tpSword.add(tpBlade, tpGuard, tpGrip, tpPommel);
            tpSword.position.set(0.38, 0.78, -0.12);
            tpSword.rotation.z = 0.10;
            tpSword.visible = false;
            pModel.add(tpSword);"""
          if old not in s:
              raise SystemExit('ERROR: third-person sword block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('All four weapon fixes applied.')

      - name: Validate patched file
        run: |
          test -s index.html
          grep -q 'Switching weapons cancels the current musket reload completely.' index.html
          grep -q 'data.musket.rotation.set(-Math.PI / 2, 0, -0.10)' index.html
          grep -q 'const bladeShape = new THREE.Shape();' index.html
          grep -q 'data.musket.position.y = 1.02 + bob;' index.html
          echo 'Validation passed.'

      - name: Commit patched index and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-final-weapon-fixes.yml
          git commit -m 'Apply final weapon fixes'
          git push
